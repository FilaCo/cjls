[general]
output-subpackage = "lsp_types"
imports = [
    "std.collection.*",
    "std.deriving.*",
    "stdx.serialization.serialization.*",
    "stdxx.{IntegerOrString, Nullable}",
    "stdxx.serialization.*",
    "stdxx.deriving.*",
    "jsonrpc.*",
]

[types.URI]
alias = "String"

[types.DocumentUri]
alias = "String"

[types.LSPAny]
alias = "AnyValue"

[types.ProgressToken]
alias = "IntegerOrString"

# the JSON-RPC codes are jsonrpc's own, the rest are adopted onto `ErrorCode`
[types.ErrorCodes]
extern = "ErrorCode"
declared = ["ParseError", "InvalidRequest", "MethodNotFound", "InvalidParams", "InternalError"]

[types.LSPErrorCodes]
extern = "ErrorCode"
