[package]
cjc-version = "1.3.0"
name = "cjls"
organization = ""
description = "nothing here"
version = "0.1.0"
target-dir = ""
script-dir = ""
output-type = "executable"
compile-option = "-Woff unused -O2 --static-std"
override-compile-option = ""
link-option = ""
package-configuration = { cjls = { compile-option = "--static" } }

[dependencies]
calca = { path = "../calca" }
jsonrpc = { path = "../jsonrpc" }
loupe = { path = "../loupe" }
rope = { path = "../rope" }
stdxx = { path = "../stdxx" }

# `cjpm build --lto`: the binary that ships from Linux, a third smaller (Darwin refuses LTO). The libraries under it
# declare it too, as one built without it is no bitcode to link with - all but stdxx, which the generators share, and
# they are linked without LTO. Only CI builds with it, into a target dir of its own after the tests, which need no LTO:
# `cjpm build` and `cjpm test` share theirs
[profile.customized-option]
lto = "--lto=full"
