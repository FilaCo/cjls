[package]
cjc-version = "1.3.0"
name = "lsp_codegen"
organization = ""
description = "nothing here"
version = "1.0.0"
target-dir = ""
script-dir = ""
output-type = "executable"
compile-option = "-Woff unused -O2 --static-std"
override-compile-option = ""
link-option = "-lc++"
package-configuration = { lsp_codegen = { compile-option = "--static" } }

[dependencies]
cjtoml = { path = "../cjtoml" }
stdxx = { path = "../stdxx" }

# Linux's SDK has std.ast as bitcode but not the flatbuffers under it, which only its archive carries: without it the
# LTO link ([profile.build.lto]) of this static executable misses every flatbuffers symbol
[target.x86_64-unknown-linux-gnu]
link-option = "-l:libcangjie-std-ast.a"
