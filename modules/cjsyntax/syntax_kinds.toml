    { name = "FuncKw", text = "func" },
    { name = "MacroKw", text = "macro" },
    { name = "QuoteKw", text = "quote" },
    { name = "LetKw", text = "let" },
    { name = "VarKw", text = "var" },
    { name = "ConstKw", text = "const" },
    { name = "TypeKw", text = "type" },
    { name = "InitKw", text = "init" },
    { name = "ThisKw", text = "this" },
    { name = "SuperKw", text = "super" },
    { name = "IfKw", text = "if" },
