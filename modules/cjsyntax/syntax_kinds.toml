    { name = "UIntNativeKw", text = "UIntNative" },
    { name = "Float16Kw", text = "Float16" },
    { name = "Float32Kw", text = "Float32" },
    { name = "Float64Kw", text = "Float64" },
    { name = "RuneKw", text = "Rune" },
    { name = "BoolKw", text = "Bool" },
    { name = "NothingKw", text = "Nothing" },
    { name = "UnitKw", text = "Unit" },
    { name = "StructKw", text = "struct" },
    { name = "EnumKw", text = "enum" },
    { name = "VArrayKw", text = "VArray" },
    { name = "ThisTypeKw", text = "This" },
    { name = "PackageKw", text = "package" },
