# The kinds of Cangjie's tokens, and of the few nodes `cangjie.ungram` has no rule for. `syntax_codegen` makes
# `src/syntax_kind.cj` of both files, and `src/ast/nodes.cj` of the grammar: change these, never what they make, then
#
#     cjpm build && target/release/bin/syntax_codegen modules/cjsyntax/syntax_kinds.toml
#
# Each kind is a `name`, with a `doc` if it needs one, and a `text` if it is spelled one way only.

grammar = "cangjie.ungram"
kinds-output = "src/syntax_kind.cj"
kinds-package = "cjsyntax"
ast-output = "src/ast/nodes.cj"
ast-package = "cjsyntax.ast"

# What the parser skips; `buildTree` weaves it back into the tree.
trivia = [
    { name = "Whitespace", doc = "spaces, tabs and form feeds" },
    { name = "Newline", doc = "one or more line breaks in a row: what ends a statement" },
    { name = "LineComment" },
    { name = "BlockComment", doc = "`/* */`, which nest" },
]

# Kinds the lexer and the parser use, but a tree never holds.
special = [
    { name = "Eof", doc = "what the parser reads past the end; never in a tree" },
    { name = "BuiltinAnnotationName", doc = "the contextual kind of an `Ident` naming a builtin annotation; never in a tree" },
]

# What the lexer cuts out of the text, the longest match first.
punctuation = [
    { name = "Dot", text = "." },
    { name = "Comma", text = "," },
    { name = "LParen", text = "(" },
    { name = "RParen", text = ")" },
    { name = "LBracket", text = "[" },
    { name = "RBracket", text = "]" },
    { name = "LBrace", text = "{" },
    { name = "RBrace", text = "}" },
    { name = "StarStar", text = "**" },
    { name = "Star", text = "*" },
    { name = "Percent", text = "%" },
    { name = "Slash", text = "/" },
    { name = "Plus", text = "+" },
    { name = "Minus", text = "-" },
    { name = "PlusPlus", text = "++" },
    { name = "MinusMinus", text = "--" },
    { name = "AmpAmp", text = "&&" },
    { name = "PipePipe", text = "||" },
    { name = "PipeGt", text = "|>" },
    { name = "TildeGt", text = "~>" },
    { name = "Bang", text = "!" },
    { name = "Amp", text = "&" },
    { name = "Pipe", text = "|" },
    { name = "Caret", text = "^" },
    { name = "Tilde", text = "~" },
    { name = "LtLt", text = "<<" },
    { name = "Colon", text = ":" },
    { name = "ColonColon", text = "::" },
    { name = "Semicolon", text = ";" },
    { name = "Eq", text = "=" },
    { name = "PlusEq", text = "+=" },
    { name = "MinusEq", text = "-=" },
    { name = "StarEq", text = "*=" },
    { name = "StarStarEq", text = "**=" },
    { name = "SlashEq", text = "/=" },
    { name = "PercentEq", text = "%=" },
    { name = "AmpAmpEq", text = "&&=" },
    { name = "PipePipeEq", text = "||=" },
    { name = "AmpEq", text = "&=" },
    { name = "PipeEq", text = "|=" },
    { name = "CaretEq", text = "^=" },
    { name = "LtLtEq", text = "<<=" },
    { name = "Arrow", text = "->" },
    { name = "LArrow", text = "<-" },
    { name = "FatArrow", text = "=>" },
    { name = "DotDot", text = ".." },
    { name = "DotDotEq", text = "..=" },
    { name = "DotDotDot", text = "..." },
    { name = "Hash", text = "#" },
    { name = "At", text = "@" },
    { name = "AtBang", text = "@!" },
    { name = "Question", text = "?" },
    { name = "Lt", text = "<" },
    { name = "Gt", text = ">" },
    { name = "LtEq", text = "<=" },
    { name = "LtColon", text = "<:" },
    { name = "EqEq", text = "==" },
    { name = "BangEq", text = "!=" },
    { name = "Dollar", text = "$" },
    { name = "Backslash", text = "\\" },
]

# Punctuation only the parser makes, of joint pieces: `>`, `=` and `?` are lexed alone, as only the parser can
# tell `a >> b` from the end of `Array<Array<T>>`.
glued-punctuation = [
    { name = "GtGt", text = ">>" },
    { name = "GtEq", text = ">=" },
    { name = "GtGtEq", text = ">>=" },
    { name = "QuestionQuestion", text = "??" },
]

# Tokens of text that varies, and ones of fixed text the lexer makes its own way. A `word` is spelled like an
# identifier, and `SyntaxKind.keyword` knows it along with the keywords.
tokens = [
    { name = "ErrorToken", doc = "a character the lexer does not know" },
    { name = "IntLit" },
    { name = "FloatLit" },
    { name = "RuneLit", doc = "`r'a'`" },
    { name = "ByteLit", doc = "`b'a'`" },
    { name = "RawStringLit", doc = "`#\"...\"#`: one token, as it has no interpolation" },
    { name = "StringStart", doc = "the opening quote(s) of a string: `\"`, `'`, `\"\"\"`, `'''`, `J\"`" },
    { name = "StringContent", doc = "text between the quotes and interpolations, escapes included" },
    { name = "StringEnd", doc = "the closing quote(s)" },
    { name = "InterpolationStart", text = "${" },
    { name = "InterpolationEnd", text = "}", doc = "the `}` closing an interpolation" },
    { name = "Ident", doc = "an identifier, backquoted or not" },
    { name = "DollarIdent", doc = "`$name`, in a quote" },
    { name = "Underscore", text = "_", word = true, doc = "`_`" },
]

# Words the lexer never takes for identifiers. The `contextual` ones are names wherever a name fits, and the
# parser remaps them to `Ident` there.
