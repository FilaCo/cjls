[package]
cjc-version = "1.3.0"
name = "cjsyntax"
organization = ""
description = "A lossless, error-tolerant Cangjie parser"
version = "0.1.0"
target-dir = ""
script-dir = ""
output-type = "static"
compile-option = "-Woff unused -O2"
override-compile-option = ""
link-option = ""
package-configuration = {}

[dependencies]
ginkgo = { path = "../ginkgo" }

# `cjpm build --lto` - see cjls's manifest; every module needs it, as without it a library is no bitcode to link with
[profile.customized-option]
lto = "--lto=full"
