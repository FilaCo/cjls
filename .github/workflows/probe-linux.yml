name: Probe Linux linking (temporary)

on:
  pull_request:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-cangjie
      - uses: astral-sh/setup-uv@v6
      - name: LTO for the Linux target only
        run: |
          printf '\n[target.x86_64-unknown-linux-gnu]\ncompile-option = "--lto=full"\n' >> cjpm.toml
          tail -4 cjpm.toml
          cjpm build
          b=target/release/bin/cjls
          { echo '## --lto=full on the target'; echo '```'; file $b; ldd $b || true; ls -l $b; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          cp $b /tmp/cjls.lto
      - name: cjpm test with LTO
        run: cjpm test 2>&1 | grep -E 'TOTAL|FAILED|success|error' | tail -5
      - name: LTO binary without the SDK
        run: env -i PATH=/usr/bin:/bin HOME="$HOME" CJLS_BIN=/tmp/cjls.lto "$(command -v uv)" run --project tests/e2e --locked pytest tests/e2e -q
